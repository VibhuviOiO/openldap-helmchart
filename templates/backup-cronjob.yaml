{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openldap.fullname" . }}-backup
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
# Online LDIF export over LDAP, not a crash-consistent snapshot: slapcat is
# offline and the data volume is RWO and held by a running provider.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openldap.fullname" . }}-backup
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.historyLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.historyLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "openldap.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # readOnlyRootFilesystem plus a projected service-account token cannot
          # coexist: the kubelet cannot create the mountpoint in a read-only root.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            # Without fsGroup the kubelet does not make the PVC writable by a
            # non-root user, so the export fails with "Permission denied" on
            # most provisioners.
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: export
              image: {{ include "openldap.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  OUT="/backup/ldap-${STAMP}.ldif"
                  TMP="${OUT}.partial"

                  # ldapsearch -y keeps a trailing newline; the image strips it.
                  printf '%s' "$(cat /run/secrets/{{ .Values.auth.secretKeys.adminPasswordKey }})" > /tmp/admin-password
                  chmod 600 /tmp/admin-password

                  ldapsearch \
                    -x \
                    -H "ldap://{{ include "openldap.fullname" . }}:{{ .Values.service.ldapPort }}" \
                    -D "{{ include "openldap.adminDn" . }}" \
                    -y /tmp/admin-password \
                    -b "{{ include "openldap.baseDn" . }}" \
                    -LLL \
                    > "${TMP}"

                  # Publish only on success, so a partial file is never mistaken
                  # for a usable backup.
                  mv "${TMP}" "${OUT}"
                  echo "wrote ${OUT}"

                  {{- if gt (int .Values.backup.retentionDays) 0 }}
                  find /backup -maxdepth 1 -name '*.ldif' -type f \
                    -mtime +{{ .Values.backup.retentionDays }} -print -delete
                  {{- else }}
                  echo "retentionDays=0, keeping every export"
                  {{- end }}
              env:
                - name: LDAPTLS_REQCERT
                  value: {{ .Values.replication.tlsReqCert | quote }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: secrets
                  mountPath: /run/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "openldap.fullname" . }}-backup
            - name: secrets
              secret:
                secretName: {{ include "openldap.secretName" . }}
                # 0444: this container runs as uid 65534 and the files are owned
                # by root, so 0400 would read as an empty password.
                defaultMode: 0444
            - name: tmp
              emptyDir: {}
---
# WaitForFirstConsumer storage classes -- local-path, and most cloud defaults --
# do not bind a claim until a pod consumes it, and the CronJob above does not run
# until its schedule. Without this the backup claim stays Pending and
# `helm install --wait` / `helm upgrade --wait` times out on an otherwise healthy
# release, because Helm waits for the PVC to be Bound.
#
# It has to be an ordinary resource, NOT a post-install hook: hooks run after
# Helm has finished waiting, which is exactly too late to unblock the wait. The
# name carries the image tag so an image change replaces the Job instead of
# tripping over an immutable field on upgrade, and it deletes itself afterwards.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openldap.fullname" . }}-backup-bind-{{ .Chart.AppVersion | replace "." "-" }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        {{- include "openldap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bind
          image: {{ include "openldap.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              test -w /backup
              echo "backup volume is bound and writable"
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: {{ include "openldap.fullname" . }}-backup
{{- end }}
