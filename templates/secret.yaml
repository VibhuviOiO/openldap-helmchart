{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.adminPassword }}
{{- fail "auth.adminPassword is required when auth.existingSecret is not set" }}
{{- end }}
{{- if and (eq (include "openldap.replicationEnabled" .) "true") (not .Values.auth.replicationPassword) }}
{{- fail "auth.replicationPassword is required when replication is enabled with more than one replica" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openldap.fullname" . }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.adminPasswordKey }}: {{ .Values.auth.adminPassword | quote }}
  {{ .Values.auth.secretKeys.configPasswordKey }}: {{ .Values.auth.configPassword | default .Values.auth.adminPassword | quote }}
  {{- if eq (include "openldap.replicationEnabled" .) "true" }}
  {{ .Values.auth.secretKeys.replicationPasswordKey }}: {{ .Values.auth.replicationPassword | quote }}
  {{- end }}
{{- end }}
