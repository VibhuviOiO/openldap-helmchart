{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openldap.fullname" . }}
  labels:
    {{- include "openldap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openldap.serverSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Provider-to-provider replication, the probes, and the chart's own test and
    # backup pods, which need to reach the LDAP port but are not providers.
    - from:
        - podSelector:
            matchLabels:
              {{- include "openldap.serverSelectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
      ports:
        - port: ldap
          protocol: TCP
        {{- if .Values.tls.enabled }}
        - port: ldaps
          protocol: TCP
        {{- end }}
    {{- with .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: ldap
          protocol: TCP
        {{- if $.Values.tls.enabled }}
        - port: ldaps
          protocol: TCP
        {{- end }}
    {{- end }}
{{- end }}
