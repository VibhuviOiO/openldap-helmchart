# Passwords are never auto-generated: a regenerated one breaks replication on
# upgrade. Set auth.existingSecret, or auth.adminPassword + auth.replicationPassword.

# Providers. 1 = standalone; the chart forces replication off.
replicaCount: 3

image:
  # Docker Hub primary, ghcr.io/vibhuvioio/openldap mirror.
  repository: vibhuvioio/openldap
  # Empty = .Chart.AppVersion, which is the OpenLDAP version.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Used to build the per-pod DNS names replication depends on.
clusterDomain: cluster.local

auth:
  existingSecret: ""
  secretKeys:
    adminPasswordKey: admin-password
    configPasswordKey: config-password
    replicationPasswordKey: replication-password
  # Required when existingSecret is empty.
  adminPassword: ""
  configPassword: ""
  # Required when replication is on. Enables cn=replicator (least privilege)
  # instead of binding replication as the directory rootDN.
  replicationPassword: ""

ldap:
  domain: example.com
  organization: Example Organization
  # Empty = derived from ldap.domain, as the image does.
  baseDn: ""

replication:
  enabled: true
  # StartTLS on the replication link; needs tls.enabled. Otherwise the bind
  # password crosses the network in cleartext.
  startTLS: false
  tlsReqCert: demand

features:
  memberOf: false
  passwordPolicy: false
  auditLog: false
  monitoring: true
  # Probes use ldapi:// EXTERNAL, so they keep working.
  disableAnonymousBind: false
  includeSchemas: "cosine,inetorgperson,nis"

tls:
  enabled: false
  existingSecret: ""
  certPath: /etc/certs/tls.crt
  keyPath: /etc/certs/tls.key
  caPath: ""
  # never | allow | try | demand
  verifyClient: never
  # 3.3 = TLS 1.2 minimum
  protocolMin: "3.3"

config:
  logLevel: ""
  threads: 16
  passwordHash: "{SSHA}"
  querySizeSoft: 500
  querySizeHard: 1000
  connMaxPending: 100
  connMaxPendingAuth: 1000
  readAccessSubject: users

service:
  type: ClusterIP
  ldapPort: 389
  ldapsPort: 636
  annotations: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image starts as root to chown volumes, then slapd runs as uid 55.
podSecurityContext:
  runAsNonRoot: false

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
  seccompProfile:
    type: RuntimeDefault

# Matches the image's stop_grace_period; shorter forces a full DB scan on restart.
terminationGracePeriodSeconds: 30

# One PVC set per pod. LMDB is single-writer, so never share them.
persistence:
  enabled: true
  # Must be WaitForFirstConsumer, or cloud block storage binds to the wrong zone.
  storageClass: ""
  data:
    # Must be >= olcDbMaxSize (1 GiB hardcoded in the image).
    size: 5Gi
    accessModes: ["ReadWriteOnce"]
  config:
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
  logs:
    size: 1Gi
    accessModes: ["ReadWriteOnce"]

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The seed-config init container only copies a few files.
initResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

probes:
  # failureThreshold x periodSeconds must be >= the image's REPLICATION_CSN_GRACE
  # (300s), otherwise a starting node is killed while the healthcheck still
  # considers it healthy.
  startup:
    failureThreshold: 60
    periodSeconds: 5
  readiness:
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30

networkPolicy:
  enabled: true
  # Raw NetworkPolicy `from:` items for clients, e.g.
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: app } }
  ingressFrom: []

# Online LDIF export over LDAP, not a crash-consistent snapshot.
backup:
  enabled: false
  schedule: "0 2 * * *"
  historyLimit: 3
  activeDeadlineSeconds: 3600
  # 0 keeps every export.
  retentionDays: 30
  persistence:
    size: 5Gi
    accessModes: ["ReadWriteOnce"]

tests:
  enabled: true
  convergenceTimeoutSeconds: 120

nodeSelector: {}
tolerations: []
affinity: {}
# Empty renders the default anti-affinity below.
topologySpreadConstraints: []

# Keeps at least one provider serving during a node drain. Disabled
# automatically with one replica, where there is nothing to protect.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Default spread: one provider per node, so losing a node cannot take out the
# whole cluster. ScheduleAnyway, so a single-node cluster still schedules.
spreadAcrossNodes: true
