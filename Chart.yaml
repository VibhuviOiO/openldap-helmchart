apiVersion: v2
name: openldap
description: Production OpenLDAP with multi-provider replication, overlays and TLS (vibhuvioio/openldap)
type: application
# Chart semver, independent of the image. appVersion is the OpenLDAP version the
# chart installs, and is what image.tag defaults to.
version: 1.0.1
appVersion: "2.6.10"
kubeVersion: ">=1.24.0-0"
# Square, vector, and already yours.
icon: https://vibhuvioio.com/img/logo.svg
keywords:
  - ldap
  - openldap
  - ldap-server
  - directory
  - identity
  - authentication
  - replication
  - high-availability
  - multi-master
  - slapd
home: https://vibhuvioio.com/openldap-docker/
sources:
  - https://github.com/VibhuviOiO/openldap-helmchart
  - https://github.com/VibhuviOiO/openldap-docker
maintainers:
  - name: Jinna Baalu
    url: https://github.com/VibhuviOiO
annotations:
  artifacthub.io/license: MIT
  # What Artifact Hub browses by. Its listing of the leading openldap charts is
  # "database", so this is the matching shelf.
  artifacthub.io/category: database
  artifacthub.io/images: |
    - name: openldap
      image: vibhuvioio/openldap:2.6.10
  # Artifact Hub requires kind/description pairs here; a bare list is rejected.
  artifacthub.io/changes: |
    - kind: added
      description: Initial chart - StatefulSet, per-pod PVCs, multi-provider replication
    - kind: fixed
      description: Seed the cn=config volume, which Kubernetes mounts empty and Docker populates
    - kind: added
      description: PodDisruptionBudget and default topology spread across nodes
  artifacthub.io/links: |
    - name: Docker image
      url: https://hub.docker.com/r/vibhuvioio/openldap
    - name: Image source
      url: https://github.com/VibhuviOiO/openldap-docker
