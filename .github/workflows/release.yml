name: release

# Pushing a tag publishes the chart. gh-pages becomes the `helm repo add`
# endpoint and the .tgz is attached to a GitHub Release:
#
#   git tag v2.6.10 && git push origin v2.6.10
#
# The tag carries the OpenLDAP version, as the image tag does: chart version,
# appVersion and the tag are all 2.6.10. A chart-only fix for the same OpenLDAP
# version appends -N, e.g. v2.6.10-1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v2.6.10"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Check the tag, the chart version and the image agree
        id: meta
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          version=$(helm show chart . | awk '/^version:/ {print $2}' | tr -d '"')
          app_version=$(helm show chart . | awk '/^appVersion:/ {print $2}' | tr -d '"')
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"

          # Tag and chart version must agree, or the repo serves a version
          # nobody tagged.
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${ref} does not match Chart.yaml version ${version}"
            exit 1
          fi
          case "$tag" in
            "$app_version"|"$app_version"-[0-9]*) ;;
            *) echo "::error::tag ${ref} does not match appVersion ${app_version}"; exit 1 ;;
          esac
          # image.tag defaults to appVersion; never publish a dangling tag.
          docker manifest inspect "vibhuvioio/openldap:${app_version}" >/dev/null \
            || { echo "::error::vibhuvioio/openldap:${app_version} is not on Docker Hub"; exit 1; }

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "app_version=$app_version"
            echo "url=https://${owner}.github.io/${repo}"
          } >> "$GITHUB_OUTPUT"
          echo "publishing openldap-${version} for OpenLDAP ${app_version}"

      - name: helm lint
        run: helm lint . --set auth.adminPassword=ci --set auth.replicationPassword=ci

      - name: Package and update gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO_URL: ${{ steps.meta.outputs.url }}
        run: |
          set -euo pipefail
          helm package . --destination .cr-release-packages

          # An orphan gh-pages branch on first run; a clone after that. The clone
          # brings the previous .tgz files along, which is what keeps older
          # versions installable after the index is regenerated.
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/gh-pages
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" /tmp/gh-pages
          else
            mkdir -p /tmp/gh-pages
            git -C /tmp/gh-pages init --quiet -b gh-pages
            git -C /tmp/gh-pages remote add origin "$remote"
          fi

          cp .cr-release-packages/*.tgz /tmp/gh-pages/
          helm repo index /tmp/gh-pages --url "$REPO_URL"

          # A Helm repository has index.yaml, not index.html, so the Pages root
          # 404s. This landing page is copied on every release, so edit the file
          # in hack/ rather than the branch.
          cp hack/gh-pages-index.html /tmp/gh-pages/index.html

          git -C /tmp/gh-pages config user.name "github-actions[bot]"
          git -C /tmp/gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages add -A
          git -C /tmp/gh-pages commit --quiet -m "chore: publish openldap-${VERSION}"
          git -C /tmp/gh-pages push --quiet origin gh-pages
          echo "gh-pages now serves:"
          helm show chart .cr-release-packages/*.tgz

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" .cr-release-packages/*.tgz \
            --title "openldap-${VERSION}" --generate-notes

      - name: Published chart is installable
        run: |
          set -euo pipefail
          # Pages needs a moment to serve the new index.
          ok=false
          for _ in $(seq 1 18); do
            if helm repo add vibhuvioio "${{ steps.meta.outputs.url }}" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::${{ steps.meta.outputs.url }} is not serving a Helm repo yet."
            echo "::error::Enable it once in Settings -> Pages (branch: gh-pages, /) and re-run this job."
            exit 1
          fi
          helm repo update
          helm search repo vibhuvioio/openldap --versions | head -5
          helm template smoke vibhuvioio/openldap --version "${{ steps.meta.outputs.version }}" \
            --set auth.adminPassword=ci --set auth.replicationPassword=ci > /dev/null
          echo "openldap-${{ steps.meta.outputs.version }} installs from the repo"
